<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --text: #24292f; --dim: #57606a; --border: #d0d7de; --bg: #ffffff; --link: #0969da; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
  .path {
    font-family: 'JetBrains Mono', monospace;
    color: var(--dim);
    font-size: 0.8rem;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  h1, h2, h3 { line-height: 1.3; }
  h1 { font-size: 1.7rem; }
  h2 { font-size: 1.3rem; margin-top: 2em; }
  p, li { line-height: 1.6; }
  code {
    background: #f6f8fa;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88em;
  }
  pre {
    background: #f6f8fa;
    padding: 12px 14px;
    border-radius: 6px;
    overflow-x: auto;
    border: 1px solid var(--border);
  }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.92em; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  a { color: var(--link); }
  .error { color: #cf222e; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="path" id="path"></div>
    <div id="content">Loading…</div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const pathEl = document.getElementById('path');
  const contentEl = document.getElementById('content');

  if (!file) {
    contentEl.innerHTML = '<p class="error">No file specified.</p>';
  } else {
    pathEl.textContent = file;
    fetch(`docs-vendor/${file}`)
      .then((r) => {
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.text();
      })
      .then((text) => {
        contentEl.innerHTML = marked.parse(text);
        contentEl.querySelectorAll('pre code').forEach((b) => hljs.highlightElement(b));
        document.title = file.split('/').pop();
      })
      .catch((err) => {
        contentEl.innerHTML = `<p class="error">Could not load this file: ${err.message}</p>`;
      });
  }
</script>
</body>
</html>
